modLoader="javafml"
loaderVersion="[47,)"
license="GPL-3.0"
issueTrackerURL="https://github.com/Sorihiko/DangoMusic/issues"

[[mods]]
modId="dangomusic"
version="${version}"
displayName="Dango Music"
authors="Sorihiko"
displayURL="https://github.com/Sorihiko/DangoMusic"
logoFile="assets/dangomusic/icon.png"
# 客户端必需；服务器可选（装了之后「一起听歌」走服务器，不用 Firebase 也不用代理）
displayTest="IGNORE_ALL_VERSION"
description='''
A NetEase Cloud Music player inside Minecraft: liquid-glass player, 3D lyrics, song card, Dynamic Island and Listen Together.
Install it on the server too and Listen Together goes through the Minecraft server instead of Firebase.
'''

[[dependencies.dangomusic]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.dangomusic]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_range}"
ordering="NONE"
side="BOTH"
