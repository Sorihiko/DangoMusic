[package]
name = "dango-music-media"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "DangoMusicMedia"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = ["Media_Playback", "Win32_System_WinRT", "Win32_UI_Shell"] }

[profile.release]
lto = "thin"
strip = true
